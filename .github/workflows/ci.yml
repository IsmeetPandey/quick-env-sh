name: Shell CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run shell test suite
      run: |
        chmod +x bootstrap.sh tests/test_platform.sh
        sh bootstrap.sh
        sh tests/test_platform.sh
